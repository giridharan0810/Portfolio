<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0b1022"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1000" cy="450" r="220" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>

  <!-- Border Card Frame -->
  <rect x="60" y="60" width="1080" height="510" rx="32" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Logo Icon -->
  <rect x="120" y="120" width="80" height="80" rx="22" fill="#0b0f19" stroke="url(#accent)" stroke-width="3"/>
  <text x="160" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="url(#accent)">G</text>

  <!-- Title & Role -->
  <text x="120" y="270" font-family="system-ui, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Giri <tspan fill="#64748b" font-weight="400">|</tspan> <tspan fill="url(#accent)">Full Stack Developer</tspan>
  </text>

  <!-- Subtitle -->
  <text x="120" y="340" font-family="system-ui, sans-serif" font-size="28" font-weight="400" fill="#94a3b8">
    React.js · JavaScript · Node.js · Express.js · Microsoft SQL Server
  </text>
  <text x="120" y="385" font-family="system-ui, sans-serif" font-size="24" font-weight="400" fill="#64748b">
    Software Developer at VConnex Software Solutions · Building Enterprise CRMs &amp; ERPs
  </text>

  <!-- Highlights Pills -->
  <g transform="translate(120, 440)">
    <rect x="0" y="0" width="220" height="48" rx="14" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)"/>
    <text x="110" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#c7d2fe">2+ Years Experience</text>

    <rect x="240" y="0" width="220" height="48" rx="14" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)"/>
    <text x="350" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#c7d2fe">6+ Production Apps</text>

    <rect x="480" y="0" width="280" height="48" rx="14" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)"/>
    <text x="620" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#c7d2fe">portfolio-h9rf.vercel.app</text>
  </g>
</svg>
